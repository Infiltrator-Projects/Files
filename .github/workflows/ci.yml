name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release_intent.outputs.version }}
      release_intent: ${{ steps.release_intent.outputs.release_intent }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read VERSION and detect release intent
        id: release_intent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          release_intent=false
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
            tag="v${version}"
            expected_assets=$(printf 'SHA256SUMS\ninfiltrator-file-manager_%s_amd64.deb\n' "$version" | sort)
            latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null || true)
            latest_tag=$(jq -r '.tag_name // empty' <<<"$latest" 2>/dev/null || true)
            latest_assets=$(jq -r '.assets[]?.name' <<<"$latest" 2>/dev/null | sort || true)

            if [[ "$latest_tag" != "$tag" || "$latest_assets" != "$expected_assets" ]]; then
              release_intent=true
              printf 'VERSION %s is not a complete latest published release; publication is required.\n' "$tag"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_intent=$release_intent" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-4-dev dpkg-dev xvfb xauth dbus-x11

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and validate Debian package
        env:
          VERSION: ${{ steps.release_intent.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist

          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb' -printf '%p\n')
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one Debian package, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi

          deb=${packages[0]}
          canonical="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'infiltrator-file-manager'
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"

          dependencies=$(dpkg-deb -f "$deb" Depends)
          grep -Eq 'libgtk-4-1' <<<"$dependencies"

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -x "$deb" "$tmp/root"
          test -x "$tmp/root/usr/bin/infiltrator-file-manager"
          test -f "$tmp/root/usr/share/applications/infiltrator-file-manager.desktop"

          if [[ "$deb" != "$canonical" ]]; then
            mv "$deb" "$canonical"
          fi

          (
            cd dist
            sha256sum "infiltrator-file-manager_${VERSION}_amd64.deb" > SHA256SUMS
          )

      - name: Preserve exact tested release package
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.release_intent.outputs.release_intent == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/infiltrator-file-manager_${{ steps.release_intent.outputs.version }}_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.build-test-package.outputs.release_intent == 'true'
    needs: build-test-package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Download exact tested package
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: dist

      - name: Publish exact tested VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build-test-package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          repo="$GITHUB_REPOSITORY"
          tag="v${VERSION}"
          deb="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          sums='dist/SHA256SUMS'
          expected_assets=$(printf 'SHA256SUMS\ninfiltrator-file-manager_%s_amd64.deb\n' "$VERSION" | sort)
          test -f "$deb"
          test -f "$sums"

          # One immutable identity: the version tag must always name the exact
          # commit whose tests and package succeeded in this run.
          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tag_commit" != "$EXPECTED_SHA" ]]; then
              printf 'Release tag %s belongs to %s, not tested commit %s.\n' \
                "$tag" "$tag_commit" "$EXPECTED_SHA" >&2
              exit 1
            fi
          else
            git tag "$tag" "$EXPECTED_SHA"
            git push origin "refs/tags/${tag}"
          fi

          # Do not use draft releases. GitHub deliberately gives drafts an
          # untagged-* identity, which makes a tag-driven transaction brittle.
          # A direct published release is simpler, and any partial publication
          # is recoverable because the next main push checks both tag and assets.
          release=$(gh api "repos/${repo}/releases/tags/${tag}" 2>/dev/null || true)
          release_id=$(jq -r '.id // empty' <<<"$release" 2>/dev/null || true)

          if [[ -z "$release_id" ]]; then
            gh release create "$tag" "$deb" "$sums" \
              --verify-tag \
              --latest \
              --title "Infiltrator File Manager ${VERSION}" \
              --notes "Infiltrator File Manager ${VERSION}. See the repository README for the current implementation surface and release status."
          else
            # Recovery path only: replace the public release's asset set with the
            # exact package from this successful Verify run and restore latest.
            mapfile -t asset_ids < <(jq -r '.assets[]?.id' <<<"$release")
            for asset_id in "${asset_ids[@]}"; do
              [[ -z "$asset_id" ]] && continue
              gh api --method DELETE "repos/${repo}/releases/assets/${asset_id}" >/dev/null
            done
            gh release upload "$tag" "$deb" "$sums"
            gh release edit "$tag" --latest
          fi

          git fetch origin --tags --force
          test "$(git rev-list -n 1 "$tag")" = "$EXPECTED_SHA"

          published=$(gh api "repos/${repo}/releases/tags/${tag}")
          test "$(jq -r '.draft' <<<"$published")" = 'false'
          test "$(jq -r '.prerelease' <<<"$published")" = 'false'
          published_assets=$(jq -r '.assets[]?.name' <<<"$published" | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Published release %s does not contain exactly the expected assets.\n' "$tag" >&2
            exit 1
          fi

          latest_tag=$(gh api "repos/${repo}/releases/latest" --jq '.tag_name')
          test "$latest_tag" = "$tag"
