name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-4-dev dpkg-dev xvfb xauth dbus-x11

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and validate Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist

          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb' -printf '%p\n')
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one Debian package, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi

          deb=${packages[0]}
          canonical="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'infiltrator-file-manager'
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"

          dependencies=$(dpkg-deb -f "$deb" Depends)
          grep -Eq 'libgtk-4-1' <<<"$dependencies"

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -x "$deb" "$tmp/root"
          test -x "$tmp/root/usr/bin/infiltrator-file-manager"
          test -f "$tmp/root/usr/share/applications/infiltrator-file-manager.desktop"

          if [[ "$deb" != "$canonical" ]]; then
            mv "$deb" "$canonical"
          fi

          (
            cd dist
            sha256sum "infiltrator-file-manager_${VERSION}_amd64.deb" > SHA256SUMS
          )

      - name: Preserve exact tested release package
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/infiltrator-file-manager_${{ steps.version.outputs.version }}_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: build-test-package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Download exact tested package
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: dist

      - name: Publish or verify exact tested VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build-test-package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          repo="$GITHUB_REPOSITORY"
          tag="v${VERSION}"
          deb="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          sums='dist/SHA256SUMS'
          expected_assets=$(printf 'SHA256SUMS\ninfiltrator-file-manager_%s_amd64.deb\n' "$VERSION" | sort)

          test -f "$deb"
          test -f "$sums"

          git fetch origin --tags --force

          tag_exists=false
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_exists=true
            tag_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tag_commit" != "$EXPECTED_SHA" ]]; then
              printf '%s already belongs to %s, not tested main commit %s. Bump VERSION before merging another main commit.\n' \
                "$tag" "$tag_commit" "$EXPECTED_SHA" >&2
              exit 1
            fi
          fi

          published_id=''
          draft_ids=()
          while IFS=$'\t' read -r release_id is_draft; do
            [[ -z "$release_id" ]] && continue
            if [[ "$is_draft" == 'true' ]]; then
              draft_ids+=("$release_id")
            elif [[ -z "$published_id" ]]; then
              published_id="$release_id"
            else
              printf 'More than one published release claims %s; refusing ambiguous publication.\n' "$tag" >&2
              exit 1
            fi
          done < <(
            gh api --paginate "repos/${repo}/releases?per_page=100" |
              jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | [.id, .draft] | @tsv'
          )

          if [[ -n "$published_id" ]]; then
            release=$(gh api "repos/${repo}/releases/${published_id}")
            test "$(jq -r '.prerelease' <<<"$release")" = 'false'
            published_assets=$(jq -r '.assets[]?.name' <<<"$release" | sort)
            if [[ "$published_assets" != "$expected_assets" ]]; then
              printf 'Published release %s has an unexpected asset set; refusing to rewrite a public release.\n' "$tag" >&2
              exit 1
            fi

            for draft_id in "${draft_ids[@]}"; do
              gh api --method DELETE "repos/${repo}/releases/${draft_id}" >/dev/null
            done

            latest_tag=$(gh api "repos/${repo}/releases/latest" --jq '.tag_name')
            if [[ "$latest_tag" != "$tag" ]]; then
              gh release edit "$tag" --latest
            fi

            printf '%s is already the complete published release for tested commit %s.\n' "$tag" "$EXPECTED_SHA"
            exit 0
          fi

          for draft_id in "${draft_ids[@]}"; do
            printf 'Removing incomplete draft release %s (%s) before retrying publication.\n' "$tag" "$draft_id"
            gh api --method DELETE "repos/${repo}/releases/${draft_id}" >/dev/null
          done

          if [[ "$tag_exists" == 'false' ]]; then
            git tag "$tag" "$EXPECTED_SHA"
            git push origin "refs/tags/${tag}"
          fi

          gh release create "$tag" "$deb" "$sums" \
            --verify-tag \
            --latest \
            --title "Infiltrator File Manager ${VERSION}" \
            --notes "Infiltrator File Manager ${VERSION}. See the repository README for the current implementation surface and release status."

          git fetch origin --tags --force
          test "$(git rev-list -n 1 "$tag")" = "$EXPECTED_SHA"

          published=$(gh api "repos/${repo}/releases/tags/${tag}")
          test "$(jq -r '.draft' <<<"$published")" = 'false'
          test "$(jq -r '.prerelease' <<<"$published")" = 'false'

          published_assets=$(jq -r '.assets[]?.name' <<<"$published" | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Published release %s does not contain exactly the expected assets.\n' "$tag" >&2
            exit 1
          fi

          latest_tag=$(gh api "repos/${repo}/releases/latest" --jq '.tag_name')
          test "$latest_tag" = "$tag"
