name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_intent: ${{ steps.release.outputs.release_intent }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read VERSION and release intent
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          release_intent=false
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
            zero=0000000000000000000000000000000000000000
            previous_version=''

            if [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "$zero" ]] &&
               git cat-file -e "${BEFORE_SHA}:VERSION" 2>/dev/null; then
              previous_version=$(git show "${BEFORE_SHA}:VERSION" | tr -d '[:space:]')
            fi

            if [[ "$version" != "$previous_version" ]]; then
              release_intent=true
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_intent=$release_intent" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-4-dev dpkg-dev xvfb xauth dbus-x11

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and validate Debian package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist

          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb' -printf '%p\n')
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one Debian package, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi

          deb=${packages[0]}
          canonical="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'infiltrator-file-manager'
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"

          dependencies=$(dpkg-deb -f "$deb" Depends)
          grep -Eq 'libgtk-4-1' <<<"$dependencies"

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -x "$deb" "$tmp/root"
          test -x "$tmp/root/usr/bin/infiltrator-file-manager"
          test -f "$tmp/root/usr/share/applications/infiltrator-file-manager.desktop"

          if [[ "$deb" != "$canonical" ]]; then
            mv "$deb" "$canonical"
          fi

          (
            cd dist
            sha256sum "infiltrator-file-manager_${VERSION}_amd64.deb" > SHA256SUMS
          )

      - name: Preserve exact tested release package
        if: steps.release.outputs.release_intent == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/infiltrator-file-manager_${{ steps.release.outputs.version }}_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.build-test-package.outputs.release_intent == 'true'
    needs: build-test-package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Download exact tested package
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: dist

      - name: Publish or resume exact tested VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build-test-package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          repo="$GITHUB_REPOSITORY"
          tag="v${VERSION}"
          deb="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          sums='dist/SHA256SUMS'
          expected_assets=$(printf 'SHA256SUMS\ninfiltrator-file-manager_%s_amd64.deb\n' "$VERSION" | sort)

          test -f "$deb"
          test -f "$sums"

          git fetch origin --tags --force

          tag_exists=false
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_exists=true
            tag_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tag_commit" != "$EXPECTED_SHA" ]]; then
              printf '%s belongs to %s, not tested release commit %s.\n' \
                "$tag" "$tag_commit" "$EXPECTED_SHA" >&2
              exit 1
            fi
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$tag_exists" != 'true' ]]; then
              printf 'Release %s exists without its git tag; refusing ambiguous recovery.\n' "$tag" >&2
              exit 1
            fi

            test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = 'false'
            test "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" = 'false'

            existing_assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            while IFS= read -r name; do
              [[ -z "$name" ]] && continue
              case "$name" in
                SHA256SUMS|"infiltrator-file-manager_${VERSION}_amd64.deb") ;;
                *)
                  printf 'Release %s has unexpected asset %s; refusing to rewrite it.\n' "$tag" "$name" >&2
                  exit 1
                  ;;
              esac
            done <<<"$existing_assets"

            for asset in "$deb" "$sums"; do
              name=$(basename "$asset")
              if ! grep -Fxq "$name" <<<"$existing_assets"; then
                gh release upload "$tag" "$asset"
              fi
            done
          elif [[ "$tag_exists" == 'true' ]]; then
            gh release create "$tag" "$deb" "$sums" \
              --verify-tag \
              --latest \
              --title "Infiltrator File Manager ${VERSION}" \
              --notes "Infiltrator File Manager ${VERSION}. See the repository README for the current implementation surface and release status."
          else
            gh release create "$tag" "$deb" "$sums" \
              --target "$EXPECTED_SHA" \
              --latest \
              --title "Infiltrator File Manager ${VERSION}" \
              --notes "Infiltrator File Manager ${VERSION}. See the repository README for the current implementation surface and release status."
          fi

          gh release edit "$tag" --latest

          git fetch origin --tags --force
          test "$(git rev-list -n 1 "$tag")" = "$EXPECTED_SHA"

          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = 'false'
          test "$(gh release view "$tag" --json isPrerelease --jq '.isPrerelease')" = 'false'

          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Published release %s does not contain exactly the expected assets.\n' "$tag" >&2
            exit 1
          fi
