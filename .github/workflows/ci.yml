name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the tested current main VERSION after verification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_intent: ${{ steps.release.outputs.release_intent }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read VERSION and release intent
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_RELEASE: ${{ inputs.release || false }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          release_intent=false
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
            zero=0000000000000000000000000000000000000000
            previous_version=''
            if [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "$zero" ]] &&
               git cat-file -e "${BEFORE_SHA}:VERSION" 2>/dev/null; then
              previous_version=$(git show "${BEFORE_SHA}:VERSION" | tr -d '[:space:]')
            fi
            if [[ "$version" != "$previous_version" ]]; then
              release_intent=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' &&
                  "$GITHUB_REF" == 'refs/heads/main' &&
                  "$MANUAL_RELEASE" == 'true' ]]; then
            release_intent=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_intent=$release_intent" >> "$GITHUB_OUTPUT"

      - name: Validate release authority syntax
        run: bash -n ci/release.sh

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-4-dev dpkg-dev xvfb xauth dbus-x11

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and validate Debian package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist

          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb' -printf '%p\n')
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one Debian package, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi

          deb=${packages[0]}
          canonical="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'infiltrator-file-manager'
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"

          dependencies=$(dpkg-deb -f "$deb" Depends)
          grep -Eq 'libgtk-4-1' <<<"$dependencies"

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -x "$deb" "$tmp/root"
          test -x "$tmp/root/usr/bin/infiltrator-file-manager"
          test -f "$tmp/root/usr/share/applications/infiltrator-file-manager.desktop"

          if [[ "$deb" != "$canonical" ]]; then
            mv "$deb" "$canonical"
          fi

          (
            cd dist
            sha256sum "infiltrator-file-manager_${VERSION}_amd64.deb" > SHA256SUMS
          )
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Preserve exact tested release package
        if: steps.release.outputs.release_intent == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/infiltrator-file-manager_${{ steps.release.outputs.version }}_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.build-test-package.outputs.release_intent == 'true'
    needs: build-test-package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Download exact tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package-${{ github.sha }}
          path: dist

      - name: Install publication verification tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev jq curl gzip

      - name: Publish or resume exact tested VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: ./ci/release.sh publish "$EXPECTED_SHA" dist

      - name: Observe central catalogue and beta APT propagation
        continue-on-error: true
        run: ./ci/release.sh wait-apt dist
