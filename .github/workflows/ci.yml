name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release_intent.outputs.version }}
      release_intent: ${{ steps.release_intent.outputs.release_intent }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read VERSION and detect release intent
        id: release_intent
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          release_intent=false
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
            previous_version=''
            if git cat-file -e 'HEAD^:VERSION' 2>/dev/null; then
              previous_version=$(git show 'HEAD^:VERSION' | tr -d '[:space:]')
            fi

            if [[ "$version" != "$previous_version" ]]; then
              release_intent=true
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_intent=$release_intent" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-4-dev dpkg-dev xvfb xauth dbus-x11

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and validate Debian package
        env:
          VERSION: ${{ steps.release_intent.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist

          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb' -printf '%p\n')
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one Debian package, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi

          deb=${packages[0]}
          canonical="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'infiltrator-file-manager'
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"

          dependencies=$(dpkg-deb -f "$deb" Depends)
          grep -Eq 'libgtk-4-1' <<<"$dependencies"

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -x "$deb" "$tmp/root"
          test -x "$tmp/root/usr/bin/infiltrator-file-manager"
          test -f "$tmp/root/usr/share/applications/infiltrator-file-manager.desktop"

          if [[ "$deb" != "$canonical" ]]; then
            mv "$deb" "$canonical"
          fi

          (
            cd dist
            sha256sum "infiltrator-file-manager_${VERSION}_amd64.deb" > SHA256SUMS
          )

      - name: Preserve exact tested release package
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.release_intent.outputs.release_intent == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/infiltrator-file-manager_${{ steps.release_intent.outputs.version }}_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.build-test-package.outputs.release_intent == 'true'
    needs: build-test-package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Download exact tested package
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: dist

      - name: Publish exact tested VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build-test-package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          tag="v${VERSION}"
          deb="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          sums='dist/SHA256SUMS'
          test -f "$deb"
          test -f "$sums"

          git fetch origin --tags --force

          tag_commit=''
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tag_commit" != "$EXPECTED_SHA" ]]; then
              printf 'Release tag %s already belongs to %s, not release commit %s.\n' \
                "$tag" "$tag_commit" "$EXPECTED_SHA" >&2
              exit 1
            fi
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ -z "$tag_commit" ]]; then
              printf 'GitHub release %s exists but its git tag is missing.\n' "$tag" >&2
              exit 1
            fi

            is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft')
            if [[ "$is_draft" != 'true' ]]; then
              published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
              expected_assets=$(printf 'SHA256SUMS\ninfiltrator-file-manager_%s_amd64.deb\n' "$VERSION" | sort)
              if [[ "$published_assets" != "$expected_assets" ]]; then
                printf 'Published release %s has an unexpected immutable asset set.\n' "$tag" >&2
                exit 1
              fi

              printf 'Release %s is already complete at %s.\n' "$tag" "$EXPECTED_SHA"
              exit 0
            fi
          else
            gh release create "$tag" \
              --draft \
              --target "$EXPECTED_SHA" \
              --title "Infiltrator File Manager ${VERSION}" \
              --notes "Infiltrator File Manager ${VERSION}. See the repository README for the current implementation surface and release status."
          fi

          # Draft releases are deliberately recoverable. A retry resumes the same
          # exact tag, uploads only missing assets, then publishes once complete.
          git fetch origin --tags --force
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf 'Draft release %s did not create its expected git tag.\n' "$tag" >&2
            exit 1
          fi

          tag_commit=$(git rev-list -n 1 "$tag")
          if [[ "$tag_commit" != "$EXPECTED_SHA" ]]; then
            printf 'Release tag %s moved to %s while publishing expected commit %s.\n' \
              "$tag" "$tag_commit" "$EXPECTED_SHA" >&2
            exit 1
          fi

          for asset in "$deb" "$sums"; do
            name=$(basename "$asset")
            existing_assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            if ! grep -Fxq "$name" <<<"$existing_assets"; then
              gh release upload "$tag" "$asset"
            fi
          done

          draft_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          expected_assets=$(printf 'SHA256SUMS\ninfiltrator-file-manager_%s_amd64.deb\n' "$VERSION" | sort)
          if [[ "$draft_assets" != "$expected_assets" ]]; then
            printf 'Draft release %s does not contain exactly the expected assets.\n' "$tag" >&2
            exit 1
          fi

          gh release edit "$tag" --draft=false --latest

          test "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = 'false'
          published_assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Published release %s does not contain exactly the expected assets.\n' "$tag" >&2
            exit 1
          fi
