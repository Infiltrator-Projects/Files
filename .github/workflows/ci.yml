name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the tested current main VERSION after verification
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # A newer state of a ref supersedes an older candidate. In particular, main
  # must never let an earlier release-intent run race a corrective commit to
  # publication after that earlier commit has ceased to be the branch head.
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    # Release qualification requires unattended APT/dpkg and system-package
    # installation; GitHub-hosted Ubuntu provides a predictable rootless
    # sudo contract. Self-hosted runners require separately qualified
    # passwordless privilege elevation and dependency provisioning.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_intent: ${{ steps.release.outputs.release_intent }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read VERSION and release intent
        id: release
        env:
          MANUAL_RELEASE: ${{ inputs.release || false }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          release_intent=false
          if [[ "$GITHUB_REF" == refs/heads/main &&
                ( "$GITHUB_EVENT_NAME" == push || "$MANUAL_RELEASE" == true ) ]]; then
            tagged_sha=$(git rev-parse -q --verify "refs/tags/v$version^{commit}" 2>/dev/null || true)
            if [[ -z "$tagged_sha" || "$tagged_sha" == "$GITHUB_SHA" ]]; then
              release_intent=true
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_intent=$release_intent" >> "$GITHUB_OUTPUT"

      - name: Validate release and native-installer syntax
        run: |
          bash -n ci/release.sh
          bash -n ci/build-native-installer.sh
          bash -n packaging/native-installer.sh

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-4-dev libarchive-dev dpkg-dev xvfb xauth dbus-x11 gdb

      - name: Regression check for missing LibArchive development files
        shell: bash
        run: |
          set -euo pipefail
          # Installed prerequisites should be accepted on the qualified runner.
          bash packaging/native-installer.sh --dry-run |
            grep -Fx 'Files native installer: prerequisites are already satisfied.'
          # Reproduce the Mint failure without uninstalling any host packages.
          # Only hide LibArchive from pkg-config; GTK 4 remains detectable.
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' '#!/bin/sh' \
            'if [ "$1" = "--exists" ] && [ "$2" = "libarchive" ]; then exit 1; fi' \
            'exec /usr/bin/pkg-config "$@"' > "$tmp/pkg-config"
          chmod +x "$tmp/pkg-config"
          PATH="$tmp:$PATH" bash packaging/native-installer.sh --dry-run |
            grep -Fx 'Files native installer: build dependencies would be installed.'

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        shell: bash
        run: |
          if ctest --test-dir build --output-on-failure; then
            exit 0
          fi
          # Keep failed UI tests diagnostic rather than silently retrying or
          # suppressing them: capture the actual GTK process stack under Xvfb.
          echo 'CTest failed. Capturing headless workspace-navigation backtrace.'
          dbus-run-session -- xvfb-run -a gdb -q -batch \
            -ex 'set pagination off' \
            -ex run \
            -ex 'thread apply all bt 35' \
            --args build/workspace-navigation-test || true
          exit 1

      - name: Build and validate Debian package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist

          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb' -printf '%p\n')
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one Debian package, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi

          deb=${packages[0]}
          canonical="dist/files_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'files'
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$deb" Architecture)" = 'amd64'

          dependencies=$(dpkg-deb -f "$deb" Depends)
          grep -Eq 'libgtk-4-1' <<<"$dependencies"

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -x "$deb" "$tmp/root"
          dpkg-deb -e "$deb" "$tmp/control"
          test -x "$tmp/control/postinst"
          grep -Fq '/System/Commands/files-ensure-fonts' "$tmp/control/postinst"
          test -x "$tmp/root/System/Commands/files-ensure-fonts"
          test ! -e "$tmp/root/usr/lib/files"
          test ! -e "$tmp/root/usr/share/doc/files"
          grep -Eq '(^|, )ca-certificates(,|$)' <<<"$dependencies"
          grep -Eq '(^|, )fontconfig(,|$)' <<<"$dependencies"
          grep -Fq 'curl | wget' <<<"$dependencies"
          test -x "$tmp/root/Programs/files"
          test ! -e "$tmp/root/usr/bin/files"
          test -f "$tmp/root/usr/share/applications/files.desktop"
          grep -Fxq 'Exec=/Programs/files %U' "$tmp/root/usr/share/applications/files.desktop"
          grep -Fxq 'MimeType=inode/directory;' "$tmp/root/usr/share/applications/files.desktop"
          test -f "$tmp/root/System/Resources/Documentation/Files/BUILD-INFO"
          grep -Fxq 'Profile: release' "$tmp/root/System/Resources/Documentation/Files/BUILD-INFO"

          if [[ "$deb" != "$canonical" ]]; then
            mv "$deb" "$canonical"
          fi

      - name: Build and qualify aggressive native installer
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Qualify installation with the declared runtime dependency, using
          # the immutable producer release rather than the APT refresh queue.
          resources_version=$(cat build/temporal-resources-version)
          [[ "$resources_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          resources_asset="infiltrator-calendar-resources_${resources_version}_amd64.deb"
          resources_dir=$(mktemp -d)
          chmod 0755 "$resources_dir"
          gh release download "v$resources_version" \
            --repo Infiltrator-Projects/Libraries \
            --pattern "$resources_asset" --dir "$resources_dir"
          digest=$(gh api "repos/Infiltrator-Projects/Libraries/releases/tags/v$resources_version" \
            --jq ".assets[] | select(.name == \"$resources_asset\") | .digest")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "${digest#sha256:}" "$resources_dir/$resources_asset" | sha256sum --check -
          sudo apt-get install -y "$resources_dir/$resources_asset"

          # Reproduce the field failure: provisioning starts with the generic
          # APT package already installed. Native +native1 must upgrade it
          # without an implicit downgrade or allow-downgrades override.
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y "./dist/files_${VERSION}_amd64.deb"
          test "$(dpkg-query -W -f='${Version}' files)" = "$VERSION"
          # Regression for real Mint OS-reset bug: dpkg still records the same
          # package while /Programs and /System were wiped. A normal install
          # reports "already the newest version" and restores nothing.
          sudo rm -f -- /Programs/files /System/Resources/Documentation/Files/BUILD-INFO
          test "$(dpkg-query -W -f='${Version}' files)" = "$VERSION"
          test ! -e /Programs/files
          test ! -e /System/Resources/Documentation/Files/BUILD-INFO
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y --reinstall "./dist/files_${VERSION}_amd64.deb"
          test -x /Programs/files
          test -f /System/Resources/Documentation/Files/BUILD-INFO
          # Native installer must likewise force dpkg to restore its own
          # identical +native1 payload, not silently accept the APT no-op.
          grep -Fq 'install -y --reinstall "$deb"' packaging/native-installer.sh

          ./ci/build-native-installer.sh dist
          native="dist/files-${VERSION}-native-installer.run"
          test -x "$native"

          sudo "$native" --system-package-mode

          test "$(dpkg-query -W -f='${Version}' files)" = "${VERSION}+native1"
          dpkg --compare-versions "${VERSION}+native1" gt "$VERSION"
          test -x /Programs/files
          test ! -e /usr/bin/files
          test ! -e /System/Programs
          grep -Fxq 'Exec=/Programs/files %U' /usr/share/applications/files.desktop
          grep -Fxq 'MimeType=inode/directory;' /usr/share/applications/files.desktop
          grep -Fxq 'Profile: aggressive' /System/Resources/Documentation/Files/BUILD-INFO
          grep -Fxq 'PGO: trained two-pass profile' /System/Resources/Documentation/Files/BUILD-INFO
          grep -Fq -- '-O3' /System/Resources/Documentation/Files/BUILD-INFO
          grep -Fq -- '-march=native' /System/Resources/Documentation/Files/BUILD-INFO

          (
            cd dist
            sha256sum "files_${VERSION}_amd64.deb" \
                      "files-${VERSION}-native-installer.run" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Preserve exact tested release package
        if: steps.release.outputs.release_intent == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/files_${{ steps.release.outputs.version }}_amd64.deb
            dist/files-${{ steps.release.outputs.version }}-native-installer.run
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.build-test-package.outputs.release_intent == 'true'
    needs: build-test-package
    permissions:
      contents: write
    # Verify publication on the same supported hosted distribution.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Download exact tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package-${{ github.sha }}
          path: dist

      - name: Install publication verification tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev jq curl gzip

      - name: Recheck current main before publication
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Publish or resume exact tested VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ./ci/release.sh publish "$EXPECTED_SHA" dist
          # Do not mark a Files release green until its exact version is
          # publicly visible in both the catalogue and beta APT index.
          ./ci/release.sh wait-apt dist
