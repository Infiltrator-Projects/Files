name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release_intent.outputs.version }}
      release_intent: ${{ steps.release_intent.outputs.release_intent }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read VERSION and detect release intent
        id: release_intent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          release_intent=false
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' ]]; then
            tag="v${version}"
            latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
            if [[ "$tag" != "$latest_tag" ]]; then
              release_intent=true
              printf 'VERSION %s is not the latest published release (%s); publication is required.\n' \
                "$tag" "${latest_tag:-none}"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_intent=$release_intent" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-4-dev dpkg-dev xvfb xauth dbus-x11

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and validate Debian package
        env:
          VERSION: ${{ steps.release_intent.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cpack --config build/CPackConfig.cmake -G DEB -B dist

          mapfile -t packages < <(find dist -maxdepth 1 -type f -name '*.deb' -printf '%p\n')
          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected exactly one Debian package, found %s.\n' "${#packages[@]}" >&2
            exit 1
          fi

          deb=${packages[0]}
          canonical="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          test "$(dpkg-deb -f "$deb" Package)" = 'infiltrator-file-manager'
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"

          dependencies=$(dpkg-deb -f "$deb" Depends)
          grep -Eq 'libgtk-4-1' <<<"$dependencies"

          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          dpkg-deb -x "$deb" "$tmp/root"
          test -x "$tmp/root/usr/bin/infiltrator-file-manager"
          test -f "$tmp/root/usr/share/applications/infiltrator-file-manager.desktop"

          if [[ "$deb" != "$canonical" ]]; then
            mv "$deb" "$canonical"
          fi

          (
            cd dist
            sha256sum "infiltrator-file-manager_${VERSION}_amd64.deb" > SHA256SUMS
          )

      - name: Preserve exact tested release package
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.release_intent.outputs.release_intent == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/infiltrator-file-manager_${{ steps.release_intent.outputs.version }}_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    if: needs.build-test-package.outputs.release_intent == 'true'
    needs: build-test-package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Download exact tested package
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ github.sha }}
          path: dist

      - name: Publish exact tested VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build-test-package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          repo="$GITHUB_REPOSITORY"
          tag="v${VERSION}"
          deb="dist/infiltrator-file-manager_${VERSION}_amd64.deb"
          sums='dist/SHA256SUMS'
          expected_assets=$(printf 'SHA256SUMS\ninfiltrator-file-manager_%s_amd64.deb\n' "$VERSION" | sort)
          test -f "$deb"
          test -f "$sums"

          # Establish one immutable release identity first. A tag-only state is safe:
          # until a release is published, the next main push will retry this version.
          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tag_commit" != "$EXPECTED_SHA" ]]; then
              printf 'Release tag %s belongs to %s, not tested commit %s.\n' \
                "$tag" "$tag_commit" "$EXPECTED_SHA" >&2
              exit 1
            fi
          else
            git tag "$tag" "$EXPECTED_SHA"
            git push origin "refs/tags/${tag}"
          fi

          releases=$(gh api "repos/${repo}/releases?per_page=100")
          release_count=$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' <<<"$releases")
          if (( release_count > 1 )); then
            printf 'Multiple GitHub releases claim %s; refusing ambiguous publication.\n' "$tag" >&2
            exit 1
          fi

          release_id=''
          if (( release_count == 1 )); then
            release_id=$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .id' <<<"$releases")
            is_draft=$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag) | .draft' <<<"$releases")

            if [[ "$is_draft" == 'false' ]]; then
              published_assets=$(gh api "repos/${repo}/releases/${release_id}/assets?per_page=100" --jq '.[].name' | sort)
              if [[ "$published_assets" != "$expected_assets" ]]; then
                printf 'Published release %s has an unexpected asset set.\n' "$tag" >&2
                exit 1
              fi
              printf 'Release %s is already complete at %s.\n' "$tag" "$EXPECTED_SHA"
              exit 0
            fi

            # A draft is private recovery state. Replace any partial assets with the
            # package produced by this exact successful Verify run, then publish once.
            mapfile -t old_assets < <(gh api "repos/${repo}/releases/${release_id}/assets?per_page=100" --jq '.[].id')
            for asset_id in "${old_assets[@]}"; do
              [[ -z "$asset_id" ]] && continue
              gh api --method DELETE "repos/${repo}/releases/assets/${asset_id}" >/dev/null
            done
            gh api --method PATCH "repos/${repo}/releases/${release_id}" -f target_commitish="$EXPECTED_SHA" >/dev/null
          else
            gh release create "$tag" \
              --draft \
              --verify-tag \
              --title "Infiltrator File Manager ${VERSION}" \
              --notes "Infiltrator File Manager ${VERSION}. See the repository README for the current implementation surface and release status."
            releases=$(gh api "repos/${repo}/releases?per_page=100")
            release_id=$(jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag and .draft == true) | .id' <<<"$releases")
            [[ "$release_id" =~ ^[0-9]+$ ]]
          fi

          gh release upload "$tag" "$deb" "$sums" --clobber

          draft_assets=$(gh api "repos/${repo}/releases/${release_id}/assets?per_page=100" --jq '.[].name' | sort)
          if [[ "$draft_assets" != "$expected_assets" ]]; then
            printf 'Draft release %s does not contain exactly the expected assets.\n' "$tag" >&2
            exit 1
          fi

          gh api --method PATCH "repos/${repo}/releases/${release_id}" -F draft=false -f make_latest=true >/dev/null

          git fetch origin --tags --force
          test "$(git rev-list -n 1 "$tag")" = "$EXPECTED_SHA"
          test "$(gh api "repos/${repo}/releases/${release_id}" --jq '.draft')" = 'false'

          published_assets=$(gh api "repos/${repo}/releases/${release_id}/assets?per_page=100" --jq '.[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Published release %s does not contain exactly the expected assets.\n' "$tag" >&2
            exit 1
          fi
