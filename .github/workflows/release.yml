# SPDX-License-Identifier: GPL-3.0-or-later
name: Verify APT publication

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: verify-apt-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: false

      - name: Install publication-check dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq

      - name: Determine whether this commit was released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}"

          git fetch origin --tags --force

          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo 'check=false' >> "$GITHUB_OUTPUT"
            echo "No ${tag} exists; this was an ordinary verified main commit."
            exit 0
          fi

          tag_commit=$(git rev-list -n 1 "$tag")
          if [[ "$tag_commit" != "$EXPECTED_SHA" ]]; then
            echo 'check=false' >> "$GITHUB_OUTPUT"
            echo "${tag} belongs to ${tag_commit}, not this later main commit ${EXPECTED_SHA}."
            exit 0
          fi

          gh release view "$tag" >/dev/null
          echo 'check=true' >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify public central APT publication
        if: steps.released.outputs.check == 'true'
        env:
          VERSION: ${{ steps.released.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          base='https://infiltrator-projects.github.io/Infiltrator-Repository'
          app_id='infiltrator-file-manager'
          package='infiltrator-file-manager'

          for attempt in $(seq 1 80); do
            stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            catalogue=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "${base}/catalogue/apps.json?release=${stamp}" || true)
            packages=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "${base}/dists/beta/main/binary-amd64/Packages?release=${stamp}" || true)

            catalogue_version=$(jq -r --arg id "$app_id" \
              '.[] | select(.id == $id) | (.version // "")' <<<"$catalogue" 2>/dev/null | head -n1)
            package_versions=$(awk -v wanted="$package" '
              BEGIN { RS=""; FS="\n" }
              {
                pkg=""; ver=""
                for (i=1; i<=NF; i++) {
                  if ($i ~ /^Package: /) pkg=substr($i, 10)
                  else if ($i ~ /^Version: /) ver=substr($i, 10)
                }
                if (pkg == wanted && ver != "") print ver
              }
            ' <<<"$packages")

            if [[ "$catalogue_version" == "$VERSION" ]] && grep -Fxq "$VERSION" <<<"$package_versions"; then
              printf 'Central APT publication verified for Files %s.\n' "$VERSION"
              exit 0
            fi

            printf 'Waiting for central APT publication of Files %s (catalogue=%s, attempt %s/80)...\n' \
              "$VERSION" "${catalogue_version:-<unavailable>}" "$attempt"
            sleep 15
          done

          printf 'Central APT has not published Files %s yet. GitHub release remains valid; distribution is pending.\n' \
            "$VERSION" >&2
          exit 1
