name: HAL P1 ownership repair

on:
  push:
    branches:
      - swarm/destination-ownership
    paths:
      - .github/workflows/hal-p1-repair.yml
      - tools/hal_p1_repair.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: swarm/destination-ownership
          fetch-depth: 0
          submodules: recursive

      - name: Apply bounded repair
        run: python3 tools/hal_p1_repair.py

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config libgtk-4-dev

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Commit repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add src/core/destination_ownership.hpp src/core/transfer_operation_engine.cpp tests/destination_ownership_test.cpp
          if git diff --cached --quiet; then
            echo 'No repair changes produced.' >&2
            exit 1
          fi
          git commit -m 'Fix protected staging ownership races'
          git push origin HEAD:swarm/destination-ownership
