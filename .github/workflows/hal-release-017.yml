name: HAL stage Files 0.1.17 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/hal-release-017.yml]

permissions:
  contents: write

jobs:
  release-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MERGE_SHA: 75997eb8e3eccf6d7fa9974ee5a59e35c78f2acd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: false
      - name: Create exact release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MERGE_SHA"
          test "$(cat VERSION)" = "0.1.16"
          printf '0.1.17\n' > VERSION
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          if text.count('0.1.16') != 4:
              raise SystemExit(f'Expected four 0.1.16 README references, found {text.count("0.1.16")}')
          text = text.replace('0.1.16', '0.1.17')
          text = text.replace(
              'recursive directory transfer is assembled under a private sibling and atomically published once complete, with symbolic links preserved as links;',
              'recursive directory transfer is assembled under descriptor-rooted protected staging and atomically published once complete, with symbolic links preserved as links;')
          p.write_text(text)
          PY
          git rm .github/workflows/hal-release-017.yml
          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git add VERSION README.md
          git commit -m 'Release 0.1.17: harden destination ownership'
          git push origin HEAD:main
