name: One-time single-branch consolidation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-single-branch.yml'

permissions:
  contents: write
  issues: read

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate to main only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 swarm/single_branch_migration.py
