name: Swarm Coordinator

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: ["Verify"]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: files-swarm-coordinator
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_run' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: control
          fetch-depth: 1

      - name: Test coordinator routing and trust boundary
        working-directory: control
        run: python3 -m unittest discover -v -s swarm -p 'test_coordinator*.py'

      - name: Reconcile live GitHub into swarm state
        working-directory: control
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SWARM_TRUSTED_REVIEWERS: The-First-Infiltrator
        run: python3 swarm/coordinator_entry.py

      - name: Prune merged local PR branches
        if: always()
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"
          default_branch=$(gh api "repos/$repo" --jq '.default_branch')

          mapfile -t branches < <(
            gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name'
          )

          for branch in "${branches[@]}"; do
            [[ "$branch" == "$default_branch" ]] && continue

            open_count=$(
              gh api -X GET "repos/$repo/pulls" \
                -f state=open \
                -f head="${owner}:${branch}" \
                -F per_page=1 \
                --jq 'length'
            )
            [[ "$open_count" -gt 0 ]] && continue

            merged_count=$(
              gh api -X GET "repos/$repo/pulls" \
                -f state=closed \
                -f head="${owner}:${branch}" \
                -F per_page=100 \
                --jq '[.[] | select(.merged_at != null)] | length'
            )
            [[ "$merged_count" -eq 0 ]] && continue

            git push origin --delete "$branch"
            printf 'Pruned merged branch %s.\n' "$branch"
          done
